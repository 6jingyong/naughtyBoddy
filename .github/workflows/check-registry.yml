name: Validate registry and offline tests

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate needs registry
        run: python nb_registry.py validate
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate imported tag catalogue
        run: python nb_catalog.py validate
      - name: Verify source-attributed catalogue health
        run: python nb_catalog_health.py validate
      - name: Check tag catalogue JavaScript syntax
        run: node --check web/chooser.js
      - name: Verify synthetic failure detectors
        run: python nb_evalkit.py demo > /tmp/nb-p53-evalkit-report.json
